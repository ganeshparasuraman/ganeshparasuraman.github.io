# INACTIVE TEMPLATE. To enable, copy this file to .github/workflows/publish-blog.yml
# and enable GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Adapted to this app: build output is dist/ganeshsite/browser; blog:* scripts
# live in the repo package.json and call tools under scripts/blog/.
name: Publish Blog

on:
  push:
    branches:
      - main
    paths:
      - "src/**"                                  # blog components, blogs.ts, routes
      - "public/assets/blog/**"
      - "public/blog-index.json"
      - "content/reviewed/**"
      - "scripts/blog/**"
      - "package.json"
      - "angular.json"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-angular:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate blog
        run: npm run blog:validate

      - name: Generate blog index
        run: npm run blog:generate-index

      - name: Generate routes
        run: npm run blog:generate-routes

      - name: Build Angular
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 19 application builder output (angular.json outputPath: dist/ganeshsite)
          path: dist/ganeshsite/browser

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

  publish-medium:
    needs: build-angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Publish Medium Draft
        run: npm run blog:publish-medium
        env:
          MEDIUM_ACCESS_TOKEN: ${{ secrets.MEDIUM_ACCESS_TOKEN }}
          MEDIUM_USER_ID: ${{ secrets.MEDIUM_USER_ID }}
          MEDIUM_PUBLICATION_ID: ${{ secrets.MEDIUM_PUBLICATION_ID }}
          BLOG_BASE_URL: ${{ secrets.BLOG_BASE_URL }}
